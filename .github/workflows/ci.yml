name: CI

on:
  push:
    branches: [hermes-docs]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Retry this evidence-bound workflow with "Re-run all jobs", not partial reruns.
  test-shards:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e './src[dev]'
          python -m pip check
      - name: Test
        env:
          PYTHONPATH: src:src/hermes_escape_top/tests:scripts
        run: |
          python -m pytest --rootdir=. src/hermes_escape_top/tests -vv --durations=25 \
            -p ci_shards --ci-shard-index ${{ matrix.shard }} --ci-shard-count 8 \
            --ci-shard-report ci-results/shard-${{ matrix.shard }}.json \
            --junitxml=ci-results/tests-${{ matrix.shard }}.xml
      - name: Preserve test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: error

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e './src[dev]'
          python -m pip check
      - name: Independent test inventory
        env:
          PYTHONPATH: src:src/hermes_escape_top/tests:scripts
        run: |
          python -m pytest --rootdir=. src/hermes_escape_top/tests --collect-only -q \
            -p ci_shards --ci-shard-index 0 --ci-shard-count 1 \
            --ci-shard-report ci-results/inventory.json
      - name: Static safety checks
        if: ${{ !cancelled() }}
        run: |
          python -m ruff check src/hermes_escape_top scripts ops --select E9,F63,F7,F82
          python -m mypy --ignore-missing-imports --follow-imports=skip \
            src/hermes_escape_top/core/data/market_witness.py \
            src/hermes_escape_top/core/data/market_admission.py \
            src/hermes_escape_top/core/backtest/formal_gate.py \
            src/hermes_escape_top/web/health.py
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: python -m pip_audit -r requirements.lock --no-deps --disable-pip --progress-spinner off
      - name: Governance
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: src
        run: python scripts/check_governance_consistency.py
      - name: Compile
        if: ${{ !cancelled() }}
        run: python -m compileall -q src/hermes_escape_top scripts ops
      - name: Preserve independent inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-inventory-attempt-${{ github.run_attempt }}
          path: ci-results/inventory.json
          if-no-files-found: error

  verify:
    if: ${{ always() }}
    needs: [test-shards, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-*-attempt-${{ github.run_attempt }}
          path: ci-results/
          merge-multiple: true
      - name: Require every gate and exact coverage (retry with Re-run all jobs)
        env:
          TEST_RESULT: ${{ needs.test-shards.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$CHECKS_RESULT" = success
          python scripts/ci_shards.py --count 8 --inventory ci-results/inventory.json ci-results/
