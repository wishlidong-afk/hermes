name: CI

on:
  push:
    branches: [hermes-docs]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e './src[dev]'
      - name: Test
        env:
          PYTHONPATH: src:src/hermes_escape_top/tests
        run: python -m pytest src/hermes_escape_top/tests -q
      - name: Governance
        env:
          PYTHONPATH: src
        run: python scripts/check_governance_consistency.py
      - name: Compile
        run: python -m compileall -q src/hermes_escape_top scripts ops
